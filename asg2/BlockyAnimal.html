<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anish Talluri - Assignment 2</title>
  </head>

  <body onload="main()">
    <canvas id="webgl" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>
    <br><br>
    <p id="numdot">XXX</p>
    
    Camera Angle (Horizontal) <input type="range" min="0" max = "360" value="0" class="slider" id="angleSlide">
    <p>
    Camera Angle (Vertical) <input type="range" min="-90" max = "90" value="0" class="slider" id="verticalSlide">
    <p>
    Zoom <input type="range" min="0.5" max="3" step="0.1" value="1" class="slider" id="zoomSlide">
    <p>
    <br>
    <button type="button" id="animToggle">Start Animation</button>
    <p>
    <button type="button" id="waveToggle">Start Wave</button>
    <p>
    Left Leg <input type="range" min="-45" max="45" value="0" class="slider" id="leftThighSlide">
    <p>
    Right Leg <input type="range" min="-45" max="45" value="0" class="slider" id="rightThighSlide">
    <p>
    Left Foot <input type="range" min="-45" max="45" value="0" class="slider" id="leftCalfSlide">
    <p>
    Right Foot <input type="range" min="-45" max="45" value="0" class="slider" id="rightCalfSlide">
    <p>
    Left Arm <input type="range" min="-180" max="180" value="0" class="slider" id="leftArmSlide">
    <p>
    Right Arm <input type="range" min="-180" max="180" value="0" class="slider" id="rightArmSlide">
    <p>

    
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix.js"></script>
    <script src="Triangle.js"></script>
    <script src="Point.js"></script>
    <script src="Circle.js"></script>
    <script src="Cube.js"></script>
    <script src="Sphere.js"></script>
    <script src="BlockyAnimal.js"></script>

  </body>
</html>
